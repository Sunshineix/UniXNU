name: Linux build

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: Sunshineix/UniXNU-pma120
      device_ref:
        description: Device repository ref
        required: true
        default: main
      defconfig:
        description: Defconfig name (configs/ of the device repository)
        required: true
        default: pma120_ipados27_defconfig
      steps:
        description: What to build after the kernel
        type: choice
        options: [kernel, kernel payload, kernel payload bootimg]
        default: kernel

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Checkout UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: be0e4fab0072bceaa8d744a4a6875ba5461cd7ff
          path: unixnu

      - name: Checkout device
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device

      - name: Cache the Linux toolchain
        uses: actions/cache@v4
        with:
          path: /opt/unixnu-linux
          key: unixnu-toolchain-${{ runner.os }}-${{ hashFiles('unixnu/scripts/linux/setup-toolchain.py') }}

      - name: Install the Linux toolchain
        run: |
          if [ ! -x /opt/unixnu-linux/llvm/bin/clang ]; then
            sudo python3 unixnu/scripts/linux/setup-toolchain.py
          fi

      - name: Build the kernel
        run: |
          cd unixnu
          ./unixnu defconfig "${{ inputs.defconfig }}" -D ../device
          ./unixnu fetch
          ./unixnu build kernel -j "$(nproc)"

      - name: Upload the kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: unixnu/out/**/kernel/**
          if-no-files-found: ignore

      - name: Fetch the OS inputs
        if: always() && inputs.steps != 'kernel'
        run: |
          cd unixnu
          ./unixnu ipsw fetch DeviceTree StaticTrustCache Cryptex1,SystemTrustCache

      - name: Build the payload
        if: always() && inputs.steps != 'kernel'
        run: |
          cd unixnu
          ./unixnu build payload \
            --unique-chip-id 0x0123456789abcdef \
            --trust-cache "$(ls out/ipsw/*/*.trustcache | head -1)" || true

      - name: Pack the boot image
        if: always() && inputs.steps == 'kernel payload bootimg'
        run: |
          cd unixnu
          ./unixnu bootimg || true

      - name: Upload payload and boot
        if: always() && inputs.steps != 'kernel'
        uses: actions/upload-artifact@v4
        with:
          name: payload
          path: |
            unixnu/out/**/payload/**
            unixnu/out/**/boot/**
          if-no-files-found: ignore

      - name: Tail the logs
        if: always()
        run: |
          find unixnu/out -name '*.log' -type f 2>/dev/null | head -20 | while read f; do echo "=== $f ==="; tail -n 120 "$f"; done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: unixnu/out/**/logs/**
          if-no-files-found: ignore
